# Surfaces the declared graph against a pull request's own diff: a lockstep edge with only one
# side touched, or a guarded line the diff edited. Advisory only — `cm verify` (the existing gate
# workflow) is what blocks; this never does. Runs the COMMITTED checker, like every other recipe
# here, so the PR comment and the gate never disagree about what is declared. Copy to
# .github/workflows/ alongside the gate workflow.
name: codemap pr comment
on:
  pull_request:
permissions: { contents: read, pull-requests: write }
jobs:
  pr-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          git fetch -q origin "${{ github.event.pull_request.base.ref }}"
          BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          .forge/codemap/cm pr-comment --base "$BASE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
