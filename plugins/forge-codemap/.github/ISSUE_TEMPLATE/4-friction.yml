name: Không cài / không chạy được
description: Gãy ở bước cài, bước chạy đầu tiên, hoặc lúc dựng baseline.
labels: ["friction"]
body:
  - type: textarea
    id: what
    attributes:
      label: Lệnh đã chạy và output
      render: shell
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Bạn đang cố làm gì
      description: Mô tả ý định, không chỉ lỗi — nó cho biết tài liệu dẫn sai chỗ nào.
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Môi trường
      placeholder: "node -v · OS · repo bao nhiêu file"
    validations: { required: true }
