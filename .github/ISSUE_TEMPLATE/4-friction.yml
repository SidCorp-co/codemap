name: It will not install or will not run
description: Broken at install, at the first run, or while building the baseline.
labels: ["friction"]
body:
  - type: textarea
    id: what
    attributes:
      label: The command you ran, and its output
      render: shell
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you were trying to do
      description: Describe the intent, not just the error — it shows where the docs sent you wrong.
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "node -v · OS · how many files in the repo"
    validations: { required: true }
