name: The five annotations cannot express it
description: There is a real constraint, but guard/edge/flow/hack/why all fail to carry it.
labels: ["grammar-gap"]
body:
  - type: markdown
    attributes:
      value: >-
        This is codemap's most important product question. The five-tag grammar is a
        bet: that five tags cover everything worth declaring. Every report here tests
        that bet.
        <br><br>
        One caution: `cm:why` is the catch-all. If you *can* force it into a `cm:why`
        but doing so *loses information*, that is exactly the case worth reporting —
        say what gets lost.
  - type: textarea
    id: constraint
    attributes:
      label: The constraint, in one sentence
      description: "What must whoever edits this place know, that no tool will tell them?"
    validations: { required: true }
  - type: textarea
    id: tried
    attributes:
      label: Which tags you tried, and where each failed
      description: Walk all five and say why each one does not fit.
      value: |
        - guard:
        - edge:
        - flow:
        - hack:
        - why:
    validations: { required: true }
  - type: textarea
    id: consequence
    attributes:
      label: What breaks when somebody does not know it
      description: >-
        Required. A constraint whose violation costs nothing is a preference, not a
        constraint — and it does not deserve an annotation.
    validations: { required: true }
