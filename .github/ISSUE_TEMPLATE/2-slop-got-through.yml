name: The hook stayed silent (missed)
description: "Slop passed the gate, or a broken cm: annotation still verified green."
labels: ["fn"]
body:
  - type: markdown
    attributes:
      value: >-
        More dangerous than a wrong block: the gate is green while the thing it
        guards is already broken. People trust it, so they stop reading with their
        own eyes.
  - type: textarea
    id: slipped
    attributes:
      label: What got through
      description: Paste the comment or annotation. Name the diagnostic code that should have caught it.
      render: text
    validations: { required: true }
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      options:
        - "CM0xx — grammar (the annotation is written in the wrong shape)"
        - "CM1xx — referential (the annotation points at something that does not exist)"
        - "CM2xx — structural (redundant comment, derivable prose)"
        - "not sure"
    validations: { required: true }
  - type: input
    id: baseline
    attributes:
      label: Is it inside the baseline?
      description: >-
        `.forge/codemap-baseline.json` freezes legacy prose so the ratchet never
        demands a rewrite of the past. If this line is frozen, the silence is the
        design working.
      placeholder: "yes / no / not checked"
    validations: { required: true }
