name: The hook blocked a valid edit (false positive)
description: cm refused a legitimate change, or demanded the deletion of a comment worth keeping.
labels: ["fp"]
body:
  - type: markdown
    attributes:
      value: >-
        The most valuable kind of report. A hook that blocks wrongly gets removed
        from settings, and after that it guards nothing — it fails silently, and
        nobody reports it.
  - type: input
    id: code
    attributes:
      label: Diagnostic code
      placeholder: "CM104"
    validations: { required: true }
  - type: textarea
    id: receipt
    attributes:
      label: Receipt
      description: Paste the verbatim output of `cm check --json`. Do not summarize it.
      render: json
    validations: { required: true }
  - type: textarea
    id: code-block
    attributes:
      label: The code that was blocked
      description: Include a few lines before and after so the context is visible.
      render: text
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why it is valid
      description: >-
        For a comment: why is this content *not* derivable from the types, the
        names, or the path? That is the only criterion — if a tool can derive it,
        the comment is a copy that will go stale.
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version, description: "the contents of `.forge/codemap/VERSION`" }
    validations: { required: true }
